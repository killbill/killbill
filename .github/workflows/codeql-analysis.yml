name: CodeQL

on:
  push:
    branches:
      - master
      - java2x
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    uses: killbill/gh-actions-shared/.github/workflows/codeql-analysis.yml@main
    secrets:
      CLOUDSMITH_CENTRAL_PASSWORD: ${{ secrets.CLOUDSMITH_CENTRAL_PASSWORD }}
      CLOUDSMITH_KILLBILL_MAVEN_REPO_PASSWORD: ${{ secrets.CLOUDSMITH_KILLBILL_MAVEN_REPO_PASSWORD }}
